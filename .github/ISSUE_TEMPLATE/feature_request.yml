name: Feature Request
description: Propose a new input field, output field, or data-source addition
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing a new IP-registry source (e.g. PatentsView or WIPO PATENTSCOPE)? Both were
        live-verified during development and found unavailable/non-free for v1 (see `src/http.ts`
        and the README) - re-proposing either should include a note on what changed. This Actor's
        general doctrine is BYOK-first: a legitimate registered API credential from the source
        office is fine, but no CAPTCHA-solving, fingerprint spoofing, or WAF/OAuth-gate bypass.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the real use case this would unblock, not just the feature itself.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What input field, output field, or behavior would you like to see added?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New input filter
        - New output field
        - New data-source integration
        - Delta-engine / classification logic change
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Can this already be achieved with existing inputs (e.g. trialTypeCodes, dateRange, epWatchlist)? If so, why isn't that sufficient?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirmed this isn't already possible with an existing input field (see README → Input & Output Schema)
          required: true
        - label: If this proposes a new data source, I confirmed it offers a legitimate registered API/credential path (no login-wall scraping, no CAPTCHA, no WAF bypass)
          required: false
